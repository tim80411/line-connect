<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>LINE Connect Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <style>
    /* __CSS__ */
  </style>
</head>

<body>

  <!-- LOADING SCREEN -->
  <div id="loading" class="loading-screen">
    <div class="loading-logo">
      <svg viewBox="0 0 36 36" fill="none">
        <path
          d="M18 6C11.4 6 6 10.8 6 16.8c0 3.4 1.8 6.4 4.6 8.4-.2.8-.7 2.8-.8 3.2-.1.6.2.6.4.4.2-.1 2.8-1.9 4-2.6 1.2.3 2.5.4 3.8.4 6.6 0 12-4.8 12-10.8S24.6 6 18 6z"
          fill="white" />
      </svg>
    </div>
    <div class="loading-spinner"></div>
    <p class="loading-text" data-i18n="loading_connecting">Connecting to LINE Connect...</p>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="login" class="login-bg" style="display:none">
    <div class="login-card">
      <div class="login-logo" id="login-logo">
        <svg viewBox="0 0 36 36" fill="none">
          <path
            d="M18 6C11.4 6 6 10.8 6 16.8c0 3.4 1.8 6.4 4.6 8.4-.2.8-.7 2.8-.8 3.2-.1.6.2.6.4.4.2-.1 2.8-1.9 4-2.6 1.2.3 2.5.4 3.8.4 6.6 0 12-4.8 12-10.8S24.6 6 18 6z"
            fill="white" />
        </svg>
      </div>
      <h1 id="login-title">LINE Connect</h1>
      <p class="login-sub" id="login-sub" data-i18n="login_sub">Admin Dashboard</p>
      <div class="login-field">
        <input type="password" id="pw" data-i18n="login_pw_ph" placeholder="Enter admin password" autocomplete="off">
        <i data-lucide="lock" class="login-field-icon"></i>
      </div>
      <button class="btn-primary" id="btn-login" data-i18n="btn_signin">Sign In</button>
      <div id="login-err" class="login-err"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="app">


    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">
          <svg viewBox="0 0 36 36" fill="none">
            <path
              d="M18 6C11.4 6 6 10.8 6 16.8c0 3.4 1.8 6.4 4.6 8.4-.2.8-.7 2.8-.8 3.2-.1.6.2.6.4.4.2-.1 2.8-1.9 4-2.6 1.2.3 2.5.4 3.8.4 6.6 0 12-4.8 12-10.8S24.6 6 18 6z"
              fill="white" />
          </svg>
        </div>
        <span class="sidebar-brand-text">LINE Connect</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" href="#dashboard">
          <i data-lucide="layout-dashboard"></i>
          <span class="nav-label" data-i18n="nav_dashboard">Dashboard</span>
        </a>
        <a class="nav-item" data-page="inbox" href="#inbox">
          <i data-lucide="message-square"></i>
          <span class="nav-label" data-i18n="nav_conversations">Conversations</span>
          <span class="nav-badge" id="nav-badge-inbox" style="display:none">0</span>
        </a>
        <a class="nav-item" data-page="analytics" href="#analytics">
          <i data-lucide="bar-chart-3"></i>
          <span class="nav-label" data-i18n="nav_analytics">Analytics</span>
        </a>
        <a class="nav-item" data-page="settings" href="#settings">
          <i data-lucide="settings"></i>
          <span class="nav-label" data-i18n="nav_settings">Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="lang-dropdown">
          <button class="sidebar-footer-btn" id="btn-lang" title="Select Language">
            <i data-lucide="globe"></i>
            <span class="nav-label">Language: <span id="cur-lang-label">EN</span></span>
          </button>
          <div class="lang-menu" id="lang-menu">
            <button class="lang-option" data-lang="en_US">English</button>
            <button class="lang-option" data-lang="zh_Hans">简体中文</button>
            <button class="lang-option" data-lang="zh_Hant">繁體中文</button>
            <button class="lang-option" data-lang="ja_JP">日本語</button>
            <button class="lang-option" data-lang="th_TH">ภาษาไทย</button>
          </div>
        </div>
        <button class="sidebar-footer-btn" id="btn-theme" data-i18n-title="nav_dark_mode" title="Toggle dark mode">
          <i data-lucide="moon"></i>
          <span class="nav-label" data-i18n="nav_dark_mode">Dark Mode</span>
        </button>
        <button class="sidebar-footer-btn" id="btn-logout" data-i18n-title="nav_signout" title="Sign out">
          <i data-lucide="log-out"></i>
          <span class="nav-label" data-i18n="nav_signout">Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- MOBILE TOPBAR -->
    <div class="topbar" id="topbar">
      <button class="topbar-menu" id="btn-menu">
        <i data-lucide="menu"></i>
      </button>
      <div class="topbar-brand">
        <div class="topbar-logo">
          <svg viewBox="0 0 36 36" fill="none">
            <path
              d="M18 6C11.4 6 6 10.8 6 16.8c0 3.4 1.8 6.4 4.6 8.4-.2.8-.7 2.8-.8 3.2-.1.6.2.6.4.4.2-.1 2.8-1.9 4-2.6 1.2.3 2.5.4 3.8.4 6.6 0 12-4.8 12-10.8S24.6 6 18 6z"
              fill="white" />
          </svg>
        </div>
        <span>LINE Connect</span>
      </div>
      <button class="topbar-action" id="btn-theme-mobile" title="Toggle dark mode">
        <i data-lucide="moon"></i>
      </button>
    </div>

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content" id="main-content">
      <!-- Pages injected by JS -->
    </main>

  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modal-cancel" data-i18n="btn_cancel">Cancel</button>
        <button class="btn-danger" id="modal-confirm" data-i18n="btn_confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" style="display:none">
    <img id="lightbox-img" src="">
  </div>

  <script>/* __JS__ */</script>
</body>

</html>
