name: CI / Release deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    needs: test
    # Native arm64 runner (free on public repos) — no QEMU emulation;
    # matches the OCI Ampere (aarch64) cluster.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # A vX.Y.Z tag produces the immutable X.Y.Z image tag that the
          # deploy job pins in k8s-apps. Plain main pushes only produce
          # main-<sha> for ad-hoc testing — they never deploy.
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Pushing a vX.Y.Z tag is the deploy trigger: bump the image tag in
    # k8s-apps and let ArgoCD roll it out. (Creating a GitHub Release also
    # creates the tag, so `gh release create vX.Y.Z` deploys too.)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tim80411/k8s-apps
          ssh-key: ${{ secrets.K8S_APPS_DEPLOY_KEY }}
          ref: main
      - name: Bump image tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s|(image: ghcr.io/tim80411/line-connect:).*|\1${VERSION}|" \
            apps/line-connect/deployment.yaml
          grep 'image: ghcr.io/tim80411/line-connect' apps/line-connect/deployment.yaml
      - name: Commit and push (retry on concurrent pushes)
        run: |
          git config user.name "line-connect-release"
          git config user.email "noreply@github.com"
          git add apps/line-connect/deployment.yaml
          if git diff --cached --quiet; then
            echo "image tag unchanged; nothing to deploy"
            exit 0
          fi
          git commit -m "chore(line-connect): deploy ${GITHUB_REF_NAME} (release-triggered)"
          for i in 1 2 3 4 5; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
