name: CI / Release image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    needs: test
    # Native arm64 runner (free on public repos) — no QEMU emulation;
    # matches the OCI Ampere (aarch64) cluster.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # A vX.Y.Z tag produces the immutable X.Y.Z image tag. Nothing deploys
          # from this workflow any more: the OCI/k8s deployment was decommissioned
          # on 2026-10-05 (k8s-apps #289). Plain main pushes only produce
          # main-<sha> for ad-hoc testing.
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
